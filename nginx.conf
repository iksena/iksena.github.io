server {
  listen       80;
  server_name  _;

  # Root points to where we copy build artifacts
  root /usr/share/nginx/html;
  index index.html;

  # Static assets
  location /assets/ {
    try_files $uri =404;
  }

  # Fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: cache static files
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    access_log off;
  }
}
